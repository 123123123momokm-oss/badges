<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>الطباعة – منظومة الباجات</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&family=Tajawal:wght@400;700&family=Noto+Sans+Arabic:wght@400;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/konva/9.3.6/konva.min.js"></script>
<script>window.Konva||document.write('<script src="https://cdn.jsdelivr.net/npm/konva@9.3.6/konva.min.js"><\/script>')</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<script>window.qrcode||document.write('<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"><\/script>')</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script>window.jspdf||document.write('<script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"><\/script>')</script>
<script src="render.js"></script>
<style>
:root{--p:#0b6e8a;--pd:#084f63;--bg:#f3f6f8;--card:#fff;--tx:#17262e;--mu:#62757f;--bd:#d5dfe4;--err:#c0392b;--ok:#1e8449}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:'Cairo',system-ui,-apple-system,'Segoe UI',Tahoma,sans-serif;background:var(--bg);color:var(--tx);line-height:1.6;font-size:16px}
.wrap{max-width:900px;margin:0 auto;padding:12px}
.card{background:var(--card);border-radius:16px;padding:16px;box-shadow:0 2px 12px rgba(11,60,80,.08);margin-bottom:12px}
h2{font-size:18px;margin:0 0 10px}
.muted{color:var(--mu);font-size:14px}
.btn{border:0;border-radius:12px;padding:11px 15px;font:inherit;font-weight:700;font-size:15px;cursor:pointer;background:var(--p);color:#fff}
.btn:active{background:var(--pd)}.btn:disabled{opacity:.55}
.btn.sec{background:#e4eef2;color:var(--pd)}.btn.red{background:var(--err)}.btn.green{background:var(--ok)}
.btn.block{display:block;width:100%}.btn.sm{padding:7px 11px;font-size:13px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.row>*{flex:1;min-width:130px}
label{display:block;font-weight:600;margin:10px 0 4px;font-size:14px}
input,select{width:100%;padding:10px;border:1.5px solid var(--bd);border-radius:10px;font:inherit;font-size:16px;background:#fff;color:var(--tx)}
.hdr{background:var(--pd);color:#fff;padding:10px 14px;display:flex;justify-content:space-between;align-items:center;gap:10px;position:sticky;top:0;z-index:5}
.hdr small{opacity:.8;display:block;font-size:12px}
.hdr button{background:rgba(255,255,255,.18);color:#fff;border:0;border-radius:10px;padding:8px 12px;font:inherit;cursor:pointer}
.tabs{display:flex;gap:6px;overflow-x:auto;padding:10px 12px 0;max-width:900px;margin:0 auto}
.tab{white-space:nowrap;border:0;background:#e4eef2;color:var(--pd);padding:10px 16px;border-radius:12px 12px 0 0;font:inherit;font-weight:600;cursor:pointer}
.tab.on{background:#fff;color:var(--p)}
.item{background:#fff;border-radius:14px;padding:12px 14px;margin-bottom:8px;box-shadow:0 1px 8px rgba(11,60,80,.07);display:flex;gap:10px;align-items:center}
.item input[type=checkbox]{width:24px;height:24px;flex:none}
.item .nm{font-weight:700}.item .sub{font-size:13px;color:var(--mu)}
.chip{display:inline-block;border-radius:20px;padding:1px 10px;font-size:12px;font-weight:700;background:#e4eef2;color:var(--pd)}
.chip.ok{background:#e8f6ee;color:var(--ok)}
.pager{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:10px 0}
.sticky{position:sticky;bottom:0;z-index:4}
.hidden{display:none!important}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#17262e;color:#fff;padding:12px 18px;border-radius:12px;z-index:60;max-width:90%;font-size:15px}
.toast.bad{background:var(--err)}
.msg{padding:12px;border-radius:12px;background:#e8f6ee;color:var(--ok);margin-top:10px}
</style>
</head>
<body>
<div id="app"></div>
<div id="toast" class="toast hidden"></div>

<script>
"use strict";
const API = "https://ppcglbgcaqgjmapyyxae.supabase.co/functions/v1/quick-responder";
const SESS = sessionStorage.getItem("sess") || "";
if(!SESS) location.replace("admin.html");
const app = document.getElementById("app");
const MAX = 50, PAGE = 30;
const TABS = [["ready", "جاهزة للطباعة"], ["reprint", "إعادة طباعة"], ["deliver", "للتسليم"]];
let ME = null, tab = "ready", q = "", offset = 0, total = 0, SEL = new Set(), last = null, busy = false;

function h(tag, props, ...kids){
  const e = document.createElement(tag);
  if(props) for(const k in props){
    const v = props[k];
    if(k === "class") e.className = v;
    else if(k.slice(0,2) === "on") e[k] = v;
    else if(k === "text") e.textContent = v;
    else if(v !== false && v != null) e.setAttribute(k, v);
  }
  kids.flat(Infinity).forEach(c => { if(c == null || c === false) return; e.append(c.nodeType ? c : document.createTextNode(String(c))); });
  return e;
}
function toast(m, bad){ const t = document.getElementById("toast"); t.textContent = m; t.className = "toast" + (bad ? " bad" : ""); clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.add("hidden"), 4000); }
async function api(action, params){
  let r;
  try{ r = await fetch(API, { method:"POST", headers:{ "Content-Type":"application/json", "x-session":SESS }, body:JSON.stringify(Object.assign({ action }, params || {})) }); }
  catch(e){ throw new Error("تعذر الاتصال بالخادم. تحقق من الإنترنت."); }
  const j = await r.json().catch(() => ({}));
  if(r.status === 401){ sessionStorage.removeItem("sess"); location.replace("admin.html"); throw new Error(j.error || "انتهت الجلسة"); }
  if(!r.ok) throw new Error(j.error || "حدث خطأ");
  return j;
}
const dmy = (s) => { if(!s) return ""; const p = String(s).slice(0, 10).split("-"); return p[2] + "/" + p[1] + "/" + p[0]; };

/* ---------- الواجهة ---------- */
function shell(){
  const out = h("button", { text:"خروج" });
  out.onclick = async () => { try{ await api("logout"); }catch(e){} sessionStorage.removeItem("sess"); location.href = "admin.html"; };
  const bar = h("div", { class:"tabs" });
  TABS.forEach(([k, label]) => {
    const b = h("button", { class:"tab" + (k === tab ? " on" : ""), text:label });
    b.onclick = () => { tab = k; SEL = new Set(); offset = 0; last = null; [...bar.children].forEach(c => c.classList.toggle("on", c === b)); openTab(); };
    bar.append(b);
  });
  app.replaceChildren(h("div", { class:"hdr" }, h("div", null, ME.full_name, h("small", { text:"موظف الطباعة" })), out), bar, h("div", { class:"wrap", id:"main" }));
  openTab();
}
function openTab(){
  const m = document.getElementById("main"); m.replaceChildren();
  const search = h("input", { placeholder:"بحث بالاسم أو رقم الباج", value:q });
  let to; search.oninput = () => { clearTimeout(to); to = setTimeout(() => { q = search.value.trim(); offset = 0; load(); }, 450); };
  m.append(h("div", { class:"card" }, search));
  if(tab !== "deliver"){
    const quick = (n) => h("button", { class:"btn sm sec", text:"تحديد أول " + n, onclick:() => selectFirst(n) });
    const clear = h("button", { class:"btn sm sec", text:"إلغاء التحديد", onclick:() => { SEL = new Set(); load(); updatePanel(); } });
    m.append(h("div", { class:"row", style:"margin-bottom:10px" }, quick(10), quick(20), quick(50), clear));
  }
  m.append(h("div", { id:"list" }), h("div", { id:"pager", class:"pager" }));
  if(tab !== "deliver") m.append(h("div", { id:"panel", class:"card sticky" }));
  load(); updatePanel();
}
async function selectFirst(n){
  try{
    const j = await api("print.queue", { mode:tab, q:"", offset:0, limit:n });
    SEL = new Set(j.rows.map(r => r.badge_id)); await load(); updatePanel();
    toast("تم تحديد " + SEL.size + " باج");
  }catch(e){ toast(e.message, true); }
}
async function load(){
  const list = document.getElementById("list"), pager = document.getElementById("pager"); if(!list) return;
  list.replaceChildren(h("p", { class:"muted", text:"جاري التحميل..." }));
  try{
    const j = await api("print.queue", { mode:tab, q, offset, limit:PAGE }); total = j.total; list.replaceChildren();
    if(!j.rows.length) list.append(h("div", { class:"card muted", text: tab === "ready" ? "لا توجد باجات جاهزة للطباعة." : tab === "reprint" ? "لا توجد تصاريح إعادة طباعة." : "لا توجد باجات بانتظار التسليم." }));
    j.rows.forEach(r => {
      const info = h("div", { style:"flex:1" },
        h("div", { class:"nm", text:r.name_ar }), h("div", { class:"sub", style:"direction:ltr;text-align:right", text:r.name_en }),
        h("div", { class:"sub", text:r.department + " · باج رقم " + r.serial_no + " · ينتهي " + dmy(r.valid_to) }),
        r.printed_copies ? h("span", { class:"chip ok", text:"طُبع " + r.printed_copies + " نسخة" }) : null);
      let ctl;
      if(tab === "deliver"){
        ctl = h("button", { class:"btn green sm", text:"تم التسليم", onclick:async (ev) => {
          if(!confirm("تأكيد تسليم الباج رقم " + r.serial_no + " إلى " + r.name_ar + "؟")) return;
          ev.target.disabled = true;
          try{ await api("print.deliver", { badge_id:r.badge_id }); toast("تم تسجيل التسليم"); load(); }catch(e){ toast(e.message, true); ev.target.disabled = false; }
        } });
      }else{
        ctl = h("input", { type:"checkbox" }); ctl.checked = SEL.has(r.badge_id);
        ctl.onchange = () => {
          if(ctl.checked){ if(SEL.size >= MAX){ ctl.checked = false; toast("الحد الأقصى " + MAX + " باجاً في المرة الواحدة", true); return; } SEL.add(r.badge_id); }
          else SEL.delete(r.badge_id);
          updatePanel();
        };
      }
      const row = h("div", { class:"item" }, tab === "deliver" ? null : ctl, info, tab === "deliver" ? ctl : null);
      list.append(row);
    });
    const prev = h("button", { class:"btn sec sm", text:"السابق", disabled: offset === 0 ? "disabled" : null });
    const next = h("button", { class:"btn sec sm", text:"التالي", disabled: offset + PAGE >= total ? "disabled" : null });
    prev.onclick = () => { offset = Math.max(0, offset - PAGE); load(); window.scrollTo(0, 0); };
    next.onclick = () => { offset += PAGE; load(); window.scrollTo(0, 0); };
    pager.replaceChildren(prev, h("span", { class:"muted", text:(total ? offset + 1 : 0) + "–" + Math.min(offset + PAGE, total) + " من " + total }), next);
  }catch(e){ list.replaceChildren(h("div", { class:"card", text:e.message })); }
}

/* ---------- لوحة الطباعة ---------- */
const O = { layout:"single", copies:1, margin:10, gap:6, marks:true };
function updatePanel(){
  const p = document.getElementById("panel"); if(!p) return;
  p.replaceChildren();
  if(!SEL.size && !last){ p.append(h("div", { class:"muted", text:"حدّد باجاً أو أكثر للطباعة (حتى " + MAX + ")." })); return; }
  if(last){ p.append(resultBox()); return; }
  const lay = h("select", null, h("option", { value:"single", text:"صفحة لكل وجه بحجم البطاقة (طابعات البطاقات)" }), h("option", { value:"sheet", text:"ورقة A4 بعدة باجات" }));
  lay.value = O.layout;
  const copies = h("input", { type:"number", min:1, max:5, value:O.copies });
  const margin = h("input", { type:"number", min:0, max:40, step:1, value:O.margin });
  const gap = h("input", { type:"number", min:2, max:30, step:1, value:O.gap });
  const marks = h("input", { type:"checkbox", style:"width:auto" }); marks.checked = O.marks;
  const sheetOpts = h("div", { class:O.layout === "sheet" ? "" : "hidden" },
    h("div", { class:"row" }, h("div", null, h("label", { text:"الهامش (ملم)" }), margin), h("div", null, h("label", { text:"الفاصل بين الباجات (ملم)" }), gap)),
    h("label", { style:"display:flex;gap:8px;align-items:center" }, marks, "علامات القص"));
  lay.onchange = () => { O.layout = lay.value; sheetOpts.classList.toggle("hidden", O.layout !== "sheet"); };
  const go = h("button", { class:"btn block", style:"margin-top:12px", text:"إنشاء ملف PDF (" + SEL.size + " باج)" });
  go.onclick = () => {
    O.copies = Math.min(5, Math.max(1, parseInt(copies.value) || 1)); O.margin = parseFloat(margin.value) || 0;
    O.gap = Math.max(2, parseFloat(gap.value) || 6); O.marks = marks.checked; generate(go);
  };
  p.append(h("div", { class:"row" }, h("b", { text:"المحدد: " + SEL.size }), h("span", { class:"muted", text: tab === "reprint" ? "إعادة طباعة" : "طباعة أولى" })),
    h("label", { text:"طريقة الإخراج" }), lay, h("label", { text:"عدد النسخ لكل باج" }), copies, sheetOpts,
    h("p", { class:"muted", text:"الدقة 300 DPI بالأبعاد الحقيقية. الطباعة المزدوجة: اطبع على الوجهين (قلب على الحافة الطويلة). لا تُفعّل «ملاءمة الصفحة» عند الطباعة حتى لا تتغير الأبعاد." }), go);
}
function resultBox(){
  const box = h("div", null, h("div", { class:"msg", text:"تم إنشاء الملف (" + last.count + " باج × " + last.copies + " نسخة، " + last.pages + " صفحة). افتحه واطبعه، ثم أكّد النتيجة:" }),
    h("div", { class:"row", style:"margin-top:10px" },
      h("a", { class:"btn sec", style:"text-align:center;text-decoration:none", href:last.url, target:"_blank", text:"فتح PDF" }),
      h("a", { class:"btn sec", style:"text-align:center;text-decoration:none", href:last.url, download:"badges.pdf", text:"تنزيل" })));
  const ok = h("button", { class:"btn green block", style:"margin-top:10px", text:"تمت الطباعة بنجاح" });
  const bad = h("button", { class:"btn red block", style:"margin-top:8px", text:"فشلت الطباعة" });
  const cancel = h("button", { class:"btn sec block", style:"margin-top:8px", text:"رجوع بدون تسجيل" });
  async function rec(status){
    if(!confirm(status === "SUCCESS" ? "تأكيد نجاح طباعة " + last.count + " باج؟ ستنتقل حالتها إلى «مطبوع»." : "تسجيل فشل الطباعة؟")) return;
    ok.disabled = bad.disabled = true;
    try{
      await api("print.record", { badge_ids:last.ids, copies:last.copies, status, reprint:last.mode === "reprint" });
      toast(status === "SUCCESS" ? "تم تسجيل الطباعة" : "تم تسجيل الفشل");
      URL.revokeObjectURL(last.url); if(status === "SUCCESS") SEL = new Set(); last = null; load(); updatePanel();
    }catch(e){ toast(e.message, true); ok.disabled = bad.disabled = false; }
  }
  ok.onclick = () => rec("SUCCESS"); bad.onclick = () => rec("FAILED");
  cancel.onclick = () => { URL.revokeObjectURL(last.url); last = null; updatePanel(); };
  box.append(ok, bad, cancel); return box;
}

/* ---------- توليد ملف الطباعة ---------- */
function sideURL(tpl, elements, data, imgs){
  const holder = document.createElement("div"); holder.style.cssText = "position:fixed;left:-99999px;top:0"; document.body.append(holder);
  const ppm = tpl.dpi / 25.4;
  const stage = BadgeRender.draw({ container:holder, elements, widthMm:tpl.width_mm, heightMm:tpl.height_mm, ppm, scale:1, data, imgs });
  const url = stage.toDataURL({ mimeType:"image/jpeg", quality:0.95, pixelRatio:1 });
  stage.destroy(); holder.remove(); return url;
}
function cropMarks(doc, x, y, w, hh){
  const o = 1.2, l = 3; doc.setDrawColor(0); doc.setLineWidth(0.1);
  [[x, y, -1, -1], [x + w, y, 1, -1], [x, y + hh, -1, 1], [x + w, y + hh, 1, 1]].forEach(([cx, cy, sx, sy]) => {
    doc.line(cx + sx * o, cy, cx + sx * (o + l), cy); doc.line(cx, cy + sy * o, cx, cy + sy * (o + l));
  });
}
function buildPdf(cards){
  const { jsPDF } = window.jspdf, w = cards[0].w, hh = cards[0].h, ori = w > hh ? "l" : "p";
  if(O.layout === "single"){
    const doc = new jsPDF({ unit:"mm", format:[w, hh], orientation:ori });
    cards.forEach((c, i) => {
      if(i > 0) doc.addPage([w, hh], ori);
      doc.addImage(c.front, "JPEG", 0, 0, w, hh);
      doc.addPage([w, hh], ori); doc.addImage(c.back, "JPEG", 0, 0, w, hh);
    });
    return doc;
  }
  const PW = 210, PH = 297, m = O.margin, g = O.gap;
  const cols = Math.floor((PW - 2 * m + g) / (w + g)), rows = Math.floor((PH - 2 * m + g) / (hh + g));
  if(cols < 1 || rows < 1) throw new Error("حجم الباج أكبر من ورقة A4 بهذه الهوامش");
  const per = cols * rows, gw = cols * w + (cols - 1) * g, gh = rows * hh + (rows - 1) * g, x0 = (PW - gw) / 2, y0 = (PH - gh) / 2;
  const doc = new jsPDF({ unit:"mm", format:"a4", orientation:"p" }); let first = true;
  for(let s = 0; s < cards.length; s += per){
    const chunk = cards.slice(s, s + per);
    ["front", "back"].forEach((side) => {
      if(!first) doc.addPage("a4", "p"); first = false;
      chunk.forEach((c, i) => {
        let col = i % cols; const row = Math.floor(i / cols);
        if(side === "back") col = cols - 1 - col;   // mirrored so the back lines up when printed double-sided
        const x = x0 + col * (w + g), y = y0 + row * (hh + g);
        doc.addImage(c[side], "JPEG", x, y, w, hh); if(O.marks) cropMarks(doc, x, y, w, hh);
      });
    });
  }
  return doc;
}
async function generate(btn){
  if(busy) return; busy = true; btn.disabled = true;
  const say = (t) => { btn.textContent = t; };
  try{
    const mode = tab === "reprint" ? "reprint" : "print", ids = [...SEL];
    say("جاري تجهيز البيانات...");
    const j = await api("print.prepare", { badge_ids:ids, mode });
    try{ await Promise.all(["Cairo","Tajawal","Noto Sans Arabic"].flatMap(f => ["400","700"].map(w => document.fonts.load(w + ' 16px "' + f + '"', "أبجد ABC")))); }catch(e){}
    say("جاري تحميل الصور...");
    const imgs = {};
    await Promise.all(Object.keys(j.urls).map(async (k) => { imgs[k] = await BadgeRender.loadImage(j.urls[k]); }));
    const missing = Object.keys(j.urls).filter(k => !imgs[k]);
    if(missing.length) throw new Error("تعذر تحميل صور القالب. حدّث الصفحة وأعد المحاولة.");
    const cards = [];
    for(let i = 0; i < j.badges.length; i++){
      const b = j.badges[i], tpl = j.templates[b.tv]; say("رسم الباج " + (i + 1) + " من " + j.badges.length);
      await new Promise(r => setTimeout(r, 10));
      const photo = await BadgeRender.loadImage(b.photo_url);
      if(!photo) throw new Error("تعذر تحميل صورة الموظف " + (b.employee.name_ar || ""));
      const data = Object.assign({}, b.employee, { serial:b.serial, issue_date:dmy(b.issued_at), expiry_date:dmy(b.valid_to),
        verify_url:new URL("verify.html?t=" + b.token, location.href).href, photo });
      const front = sideURL(tpl, tpl.front, data, imgs), back = sideURL(tpl, tpl.back, data, imgs);
      for(let c = 0; c < O.copies; c++) cards.push({ front, back, w:tpl.width_mm, h:tpl.height_mm });
    }
    say("جاري إنشاء ملف PDF...");
    await new Promise(r => setTimeout(r, 10));
    const doc = buildPdf(cards);
    const url = URL.createObjectURL(doc.output("blob"));
    last = { url, ids, mode, copies:O.copies, count:ids.length, pages:doc.getNumberOfPages() };
  }catch(e){ toast(e.message, true); }
  busy = false; updatePanel();
}

/* ---------- التشغيل ---------- */
(async function boot(){
  try{ ME = (await api("me")).user; }catch(e){ return; }
  if(ME.role !== "PRINTER"){
    app.replaceChildren(h("div", { class:"wrap" }, h("div", { class:"card" }, h("h2", { text:"هذه الصفحة لموظف الطباعة فقط" }),
      h("a", { class:"btn", style:"text-decoration:none;display:inline-block", href:"admin.html", text:"العودة للوحة الإدارة" }))));
    return;
  }
  shell();
})();
</script>
</body>
</html>

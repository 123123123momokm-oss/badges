<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>التحقق من الباج – مستشفى الإمام الحسن المجتبى (ع)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--p:#0b6e8a;--pd:#084f63;--bg:#f3f6f8;--tx:#17262e;--mu:#62757f}
*{box-sizing:border-box}
body{margin:0;font-family:'Cairo',system-ui,-apple-system,'Segoe UI',Tahoma,sans-serif;background:var(--bg);color:var(--tx);line-height:1.6;font-size:16px}
.wrap{max-width:480px;margin:0 auto;padding:16px}
.card{background:#fff;border-radius:18px;padding:20px;box-shadow:0 2px 14px rgba(11,60,80,.1);text-align:center}
.logo{width:84px;height:84px;object-fit:contain;display:block;margin:0 auto 8px}
h1{font-size:18px;margin:4px 0}
.muted{color:var(--mu);font-size:14px}
.state{margin:16px 0;padding:14px;border-radius:14px;font-size:22px;font-weight:700}
.state.ACTIVE{background:#e8f6ee;color:#1e8449}
.state.EXPIRED{background:#fdf2dc;color:#b9770e}
.state.REVOKED,.state.ERR{background:#fdecea;color:#c0392b}
.kv{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid #edf1f3;text-align:right}
.kv span:first-child{color:var(--mu);white-space:nowrap}
.kv span:last-child{font-weight:700;text-align:left;overflow-wrap:anywhere}
</style>
</head>
<body>
<div class="wrap">
  <div class="card">
    <img id="logo" class="logo" src="logo.png" alt="">
    <h1>مستشفى الإمام الحسن المجتبى التعليمي (ع)</h1>
    <div class="muted">وزارة الصحة العراقية – التحقق من الباج التعريفي</div>
    <div id="out"><p class="muted">جاري التحقق...</p></div>
  </div>
</div>
<script>
"use strict";
const API = "https://ppcglbgcaqgjmapyyxae.supabase.co/functions/v1/smooth-action";
const STATE_AR = { ACTIVE:"باج فعّال ✔", EXPIRED:"باج منتهي الصلاحية", REVOKED:"باج ملغى" };
const out = document.getElementById("out");
const logo = document.getElementById("logo");
logo.onerror = () => { logo.style.display = "none"; };
function put(cls, text, rows){
  out.replaceChildren();
  const s = document.createElement("div"); s.className = "state " + cls; s.textContent = text; out.append(s);
  (rows || []).forEach(([k, v]) => {
    const d = document.createElement("div"); d.className = "kv";
    const a = document.createElement("span"); a.textContent = k;
    const b = document.createElement("span"); b.textContent = v || "—";
    d.append(a, b); out.append(d);
  });
}
(async function(){
  const t = new URLSearchParams(location.search).get("t") || "";
  if(!/^[0-9a-fA-F]{32}$/.test(t)){ put("ERR", "رمز التحقق غير صالح"); return; }
  try{
    const r = await fetch(API + "?action=verify&t=" + encodeURIComponent(t));
    const j = await r.json().catch(() => ({}));
    if(r.status === 404){ put("ERR", "لم يتم العثور على هذا الباج"); return; }
    if(!r.ok) throw new Error();
    const b = j.badge, d = String(b.valid_to || "").slice(0, 10).split("-");
    put(b.state, STATE_AR[b.state] || b.state, [
      ["الاسم", b.name_ar], ["Name", b.name_en], ["العنوان الوظيفي", b.job_title_ar],
      ["رقم الباج", b.serial], ["صالح حتى", d.length === 3 ? d[2] + "/" + d[1] + "/" + d[0] : ""]]);
  }catch(e){ put("ERR", "تعذر التحقق الآن. حاول لاحقاً."); }
})();
</script>
</body>
</html>
